name: Windows and server

# The Windows app and the Linux server, built on GitHub's machines.
#
#   a tag (0.1.0, v0.1.0, 0.2.0-rc1)  →  build both and add them to the GitHub Release of that tag
#                                         (the Android workflow makes the release; whichever workflow
#                                         finishes first creates it, the other one adds to it)
#   anything else (push, pull request) →  build both and keep them as run artifacts, to see that they build
#
# The Windows app is a ZIP of the Flutter app with the core (omnitun-svc.exe) next to it: unzip and run.
# It is NOT signed: Windows SmartScreen will warn on the first start. An installer with a code-signing
# certificate (a paid certificate, kept in a repository secret) is the next step; see PLAN.md, Phase 3.
# The server is two static Linux binaries (amd64, arm64) with SHA256SUMS, from scripts/build-server-release.sh.
#
# Every action is pinned to a full commit SHA. The two build jobs only read the repository (and run code
# from dependencies, so they hold no token that can write); one small job at the end, which runs nothing
# but the GitHub CLI on the files they made, is the only one that can add to a release.

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-app:
    outputs:
      version: ${{ steps.version.outputs.name }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $ver = 'dev-' + $env:GITHUB_SHA.Substring(0, 7)
          }
          $core = ($ver -split '-')[0]
          $parts = $core -split '\.'
          if ($core -match '^\d+\.\d+\.\d+$') {
            $num = [int]$parts[0] * 10000 + [int]$parts[1] * 100 + [int]$parts[2]
          } else {
            $core = '0.0.0'; $num = 1
          }
          "name=$ver" >> $env:GITHUB_OUTPUT
          "core=$core" >> $env:GITHUB_OUTPUT
          "number=$num" >> $env:GITHUB_OUTPUT
          "pre=$($ver.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "version $ver (name $core, build number $num)"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: stable

      - name: Core (omnitun-svc.exe)
        run: |
          New-Item -ItemType Directory -Force dist/app | Out-Null
          ./scripts/go.ps1 build -trimpath -o dist/app/omnitun-svc.exe ./cmd/omnitun-svc

      - name: Test the app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: App
        working-directory: app
        run: flutter build windows --release --build-name ${{ steps.version.outputs.core }} --build-number ${{ steps.version.outputs.number }}

      - name: Put the app and the core together, zip, checksums
        env:
          VER: ${{ steps.version.outputs.name }}
        run: |
          Copy-Item -Recurse -Force app/build/windows/x64/runner/Release/* dist/app/
          $zip = "dist/omnitun-$env:VER-windows-x64.zip"
          Compress-Archive -Path dist/app/* -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256) | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $zip -Leaf)" } | Set-Content dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wardkeep-windows
          path: |
            dist/omnitun-*-windows-x64.zip
            dist/SHA256SUMS-windows.txt

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="${GITHUB_REF_NAME#v}"; else VER="dev-${GITHUB_SHA:0:7}"; fi
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-* && "$GITHUB_REF" == refs/tags/* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi

      - name: Static Linux binaries (amd64, arm64)
        run: scripts/build-server-release.sh "${{ steps.version.outputs.name }}"

      - name: Check they are static ELF files
        run: |
          for f in dist/omnitun-server-linux-*; do file "$f"; done
          file dist/omnitun-server-linux-amd64 | grep -q "statically linked"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wardkeep-server-linux
          path: dist/

  # The only job that can write to the repository, and it runs nothing but the GitHub CLI on the files the
  # two jobs above built (no checkout, no build, no dependencies).
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [windows-app, server]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to add the files to a release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wardkeep-windows
          path: files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wardkeep-server-linux
          path: files
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VER: ${{ needs.windows-app.outputs.version }}
        run: |
          cd files
          cp SHA256SUMS SHA256SUMS-server.txt
          rm SHA256SUMS
          FILES=(omnitun-"$VER"-windows-x64.zip SHA256SUMS-windows.txt omnitun-server-linux-amd64 omnitun-server-linux-arm64 SHA256SUMS-server.txt)
          FLAGS=(--title "Wardkeep $VER" --generate-notes --verify-tag)
          if [[ "$VER" == *-* ]]; then FLAGS+=(--prerelease); fi
          if ! gh release create "$TAG" "${FLAGS[@]}" "${FILES[@]}"; then
            # the Android workflow made the release first: add to it
            sleep 15
            gh release upload "$TAG" "${FILES[@]}" --clobber
          fi
