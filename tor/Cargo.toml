[package]
name = "omnitun-tor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Tor client (Arti) for Wardkeep: a local SOCKS5 port the Go core routes Tor profiles into"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "omnitun-tor"
path = "src/main.rs"

[dependencies]
# rustls instead of native-tls: no OpenSSL to cross-compile for Android.
arti-client = { version = "0.47", default-features = false, features = [
    "tokio", "rustls", "compression", "static-sqlite", "bridge-client", "pt-client",
] }
tor-rtcompat = { version = "0.47", default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync"] }
futures = "0.3"
# The circuit a stream rides (relay by relay) and the country of each relay, for the globe.
tor-proto = { version = "0.47", default-features = false, features = ["stream-ctrl"] }
tor-linkspec = "0.47"
tor-geoip = { version = "0.47", features = ["embedded-db"] }
anyhow = "1"
serde_json = "1"
# Arti's TLS needs a process-wide crypto provider; ring cross-compiles to Android easily.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Only with --features dhat-heap: a heap profiler for finding what allocates and what grows.
dhat = { version = "0.3", optional = true }

# Heap profiling: cargo build --profile profiling --features dhat-heap, run it, and when it
# exits it writes dhat-heap.json (open it at https://nnethercote.github.io/dh_view/dh_view.html).
[features]
dhat-heap = ["dep:dhat"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# For flame graphs and heap profiles: the release build with speed instead of size, and symbols kept.
#   cargo build --profile profiling   (binary in target/profiling/)
[profile.profiling]
inherits = "release"
opt-level = 3
strip = false
debug = 1

# Debug builds of Arti's crypto are far too slow to verify a consensus.
[profile.dev.package."*"]
opt-level = 2
