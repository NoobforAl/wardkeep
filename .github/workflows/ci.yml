name: CI

on:
  push:
    branches: [main]
  pull_request:

# Windows and Android are what is built and released for now (the Android app is tested by the Flutter job and
# built by android.yml). The Go code is tested on Windows only: the Linux run used to fail on
# TestEndToEndHysteria (a Hysteria 1 transfer that times out on GitHub's Linux machines and passes on Windows,
# cause not found), and nothing is shipped for Linux. The Linux-only server parts have their own manual
# workflow, docker-e2e.yml.
jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/go.ps1 vet ./...
        shell: pwsh
      - run: ./scripts/go.ps1 test ./...
        shell: pwsh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: tor

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Every dependency that ships must have an identifiable license (fails otherwise);
  # the generated notices are kept as an artifact for releases.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: go mod download
      - run: python3 scripts/gen-notices.py --check
      - run: python3 scripts/gen-notices.py
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
