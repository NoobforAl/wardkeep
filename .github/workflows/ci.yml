name: CI

# The checks: tests, lint and the license check. Nothing is built or published here; the test jobs send their
# coverage to Codecov (flags go, rust, flutter; settings in codecov.yml).
#
#   push to main, pull request  →  run the checks
#   release.yml                 →  runs the same checks first (workflow_call) and builds nothing unless they all pass
#
# The jobs are independent and run side by side; the slowest one (Go on Windows) sets the time. Every job restores
# the caches of its toolchain (Go modules and build cache, Flutter SDK and pub cache, Cargo), so a run after a small
# change only compiles what changed. A new push to a pull request cancels the older run of that pull request.
#
# The Go code is tested on Windows only: the Linux run used to fail on TestEndToEndHysteria (a Hysteria 1 transfer that
# times out on GitHub's Linux machines and passes on Windows, cause not found). The Linux-only server parts have their
# own manual workflow, docker-e2e.yml.
#
# Every action is pinned to a full commit SHA; Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  go:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: ./scripts/go.ps1 vet ./...
        shell: pwsh
      # Flag and value as two words: PowerShell splits `-coverprofile=coverage.out` at the dot when calling a script.
      - run: ./scripts/go.ps1 test -coverprofile coverage.out -covermode atomic ./...
        shell: pwsh
      # Coverage report for https://app.codecov.io/gh/NoobforAl/wardkeep (secret CODECOV_TOKEN). A failed upload
      # does not fail the checks.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: go
          disable_search: true
          fail_ci_if_error: false

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-17)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tor
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      # The tests, run once with coverage (cargo-llvm-cov needs the llvm-tools component).
      - run: rustup component add llvm-tools-preview && cargo llvm-cov --lcov --output-path lcov.info
        working-directory: tor
      # Coverage report for https://app.codecov.io/gh/NoobforAl/wardkeep (secret CODECOV_TOKEN). A failed upload
      # does not fail the checks.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tor/lcov.info
          flags: rust
          disable_search: true
          fail_ci_if_error: false
      # Lints in tor/Cargo.toml; clippy is part of the stable toolchain.
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: tor
      # Vulnerabilities, licenses and sources (tor/deny.toml).
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny check
        working-directory: tor

  # golangci-lint (with gosec; .golangci.yml) and govulncheck. On Linux: the Windows-only code is still checked
  # by `go vet` in the go job.
  go-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
          TAGS=$(sed -n 's/^TAGS := //p' Makefile)
          golangci-lint run --build-tags "$TAGS" --timeout 15m ./...
          govulncheck -tags "$TAGS" ./...

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # pubspec.lock is the truth: a pubspec.yaml that disagrees with it fails here, not on somebody's machine.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --coverage
      # Coverage report for https://app.codecov.io/gh/NoobforAl/wardkeep (secret CODECOV_TOKEN). A failed upload
      # does not fail the checks.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage/lcov.info
          flags: flutter
          disable_search: true
          fail_ci_if_error: false

  # Every dependency that ships must have an identifiable license (fails otherwise);
  # the generated notices are kept as an artifact for releases.
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10-17)
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: go mod download
      - run: python3 scripts/gen-notices.py --check
      - run: python3 scripts/gen-notices.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
