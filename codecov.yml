# Codecov settings (https://app.codecov.io/gh/NoobforAl/wardkeep). The CI jobs upload one report per language
# (.github/workflows/ci.yml); each gets a flag so the three can be read apart.
coverage:
  status:
    # Coverage is reported, never a reason to fail a pull request.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  go:
    paths: [cmd/, core/, server/, tools/]
    carryforward: true
  rust:
    paths: [tor/]
    carryforward: true
  flutter:
    paths: [app/lib/]
    carryforward: true

ignore:
  - third_party/
  - "**/*_test.go"
  - "app/lib/l10n/app_localizations*.dart"
  - "app/lib/state/country_names.dart"

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true
