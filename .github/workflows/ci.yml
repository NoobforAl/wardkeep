name: CI

# The checks: tests, lint and the license check. Nothing is built or published here; the test jobs send their
# coverage to Codecov (flags go, rust, flutter; settings in codecov.yml).
#
#   push to main, pull request  →  run the checks
#   release.yml                 →  runs the same checks first (workflow_call) and builds nothing unless they all pass
#
# The jobs are independent and run side by side; the slowest one (Go on Windows) sets the time. Every job restores
# the caches of its toolchain (Go modules and build cache, Flutter SDK and pub cache, Cargo), so a run after a small
# change only compiles what changed. A new push to a pull request cancels the older run of that pull request.
#
# The Go code is tested on Windows only: the Linux run used to fail on TestEndToEndHysteria (a Hysteria 1 transfer that
# times out on GitHub's Linux machines and passes on Windows, cause not found). The Linux-only server parts have their
# own manual workflow, docker-e2e.yml.
#
# Every action is pinned to a full commit SHA; Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  go:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27' # the newest 1.27.x; go.mod's patch version is only the least its dependencies need
          check-latest: true
      - run: ./scripts/go.ps1 vet ./...
        shell: pwsh
      # Flag and value as two words: PowerShell splits `-coverprofile=coverage.out` at the dot when calling a script.
      - run: ./scripts/go.ps1 test -coverprofile coverage.out -covermode atomic ./...
        shell: pwsh
      # Coverage report for https://app.codecov.io/gh/NoobforAl/wardkeep (secret CODECOV_TOKEN). A failed upload
      # does not fail the checks.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: go
          disable_search: true
          fail_ci_if_error: false

  # The two Rust crates (tor/, the Tor client; rvpn/, the rVPN client) in parallel, one job each: Tor's Arti build
  # takes about ten minutes, and the rVPN crate no longer waits behind it.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # a failure in one crate still reports the other
      matrix:
        crate: [tor, rvpn]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (2026-10-17); the version is the toolchain input
        with:
          toolchain: "1.100.0" # = tor/ and rvpn/rust-toolchain.toml
          components: clippy, rustfmt, llvm-tools-preview
      # Saved even when a later step fails: before, a red run kept no cache, so the next run compiled every crate again.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ matrix.crate }}
          cache-on-failure: true
      # Prebuilt binaries: compiling cargo-deny from source took two minutes of every run.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov,cargo-deny@0.20.2
      - run: cargo fmt --check
      # The tests, run once with coverage.
      - run: cargo llvm-cov --lcov --output-path lcov.info
      # Coverage report for https://app.codecov.io/gh/NoobforAl/wardkeep (secret CODECOV_TOKEN). A failed upload
      # does not fail the checks.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.crate }}/lcov.info
          flags: rust
          disable_search: true
          fail_ci_if_error: false
      # Lints in the crate's Cargo.toml [lints].
      - run: cargo clippy --all-targets -- -D warnings
      # Vulnerabilities, licenses and sources (the crate's deny.toml).
      - run: cargo deny check

  # golangci-lint (with gosec; .golangci.yml) and govulncheck. On Linux: the Windows-only code is still checked
  # by `go vet` in the go job.
  go-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27' # the newest 1.27.x; go.mod's patch version is only the least its dependencies need
          check-latest: true
      - name: Build tags (from the Makefile)
        run: echo "TAGS=$(sed -n 's/^TAGS := //p' Makefile)" >> "$GITHUB_ENV"
      # The prebuilt golangci-lint and its cache of results. Building it with `go install` took about a minute of
      # every run and failed now and then while fetching modules.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --build-tags ${{ env.TAGS }} --timeout 15m
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -tags "$TAGS" ./...

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # pubspec.lock is the truth: a pubspec.yaml that disagrees with it fails here, not on somebody's machine.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --coverage
      # Coverage report for https://app.codecov.io/gh/NoobforAl/wardkeep (secret CODECOV_TOKEN). A failed upload
      # does not fail the checks.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/coverage/lcov.info
          flags: flutter
          disable_search: true
          fail_ci_if_error: false

  # Every dependency that ships must have an identifiable license (fails otherwise);
  # the generated notices are kept as an artifact for releases.
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27' # the newest 1.27.x; go.mod's patch version is only the least its dependencies need
          check-latest: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (2026-10-17); the version is the toolchain input
        with:
          toolchain: "1.100.0" # = tor/ and rvpn/rust-toolchain.toml
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: go mod download
      - run: python3 scripts/gen-notices.py --check
      - run: python3 scripts/gen-notices.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
