# The analyzer settings for the app: Flutter's recommended lints plus stricter typing
# and a set of extra rules that catch real bugs (leaked subscriptions and sinks,
# lost futures, dynamic calls) rather than style. Run with `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    # Written by `flutter gen-l10n` from the .arb files (see l10n.yaml).
    - lib/l10n/app_localizations*.dart

  language:
    # No implicit downcasts from dynamic: a JSON field that is not what the code thinks fails here, not at run time.
    strict-casts: true
    # No silent `dynamic` where the type could not be inferred (empty literals, untyped closures).
    strict-inference: true
    # No raw generics (`List`, `Future`) that quietly mean `<dynamic>`.
    strict-raw-types: true

  # A left-out required argument or a non-void function that can end without a value is already a compile
  # error under null safety. The lints below that point at leaks and lost errors are raised from info to
  # warning so they stand out in the IDE (`flutter analyze` fails on any finding, infos included).
  errors:
    cancel_subscriptions: warning
    close_sinks: warning
    unawaited_futures: warning
    discarded_futures: warning
    only_throw_errors: warning
    avoid_dynamic_calls: warning

linter:
  rules:
    # Leaks: a StreamSubscription that is never cancelled, a StreamController / sink that is never closed.
    cancel_subscriptions: true
    close_sinks: true
    # Lost futures: in async functions (unawaited_futures) and in sync ones (discarded_futures).
    # Fire-and-forget calls say so with unawaited().
    unawaited_futures: true
    discarded_futures: true
    # Calls on `dynamic` skip all checking (typos in JSON field access compile fine).
    avoid_dynamic_calls: true
    # toString() of a runtime type is minified in release builds, so comparing it breaks only there.
    avoid_type_to_string: true
    # A missing comma in a list of strings silently joins two items.
    no_adjacent_strings_in_list: true
    # operator== without a type check throws on other types instead of returning false.
    test_types_in_equals: true
    # return / throw in finally swallows the real exception.
    throw_in_finally: true
    # A statement with no effect (e.g. `x == y;` meant as an assignment).
    unnecessary_statements: true
    # Only Exception / Error subclasses are thrown, so catch blocks and stack traces work.
    only_throw_errors: true
    # `if (true)`-style conditions: dead code or a typo.
    literal_only_boolean_expressions: true
    # `x = x;`, usually a constructor field mix-up.
    no_self_assignments: true
    # A function without a declared return type returns dynamic (and hides mistakes).
    always_declare_return_types: true
    # Nested async callbacks: a return type of void where a Future was meant (the future is then lost).
    avoid_void_async: true
    # pubspec: no http:// or git:// dependency URLs.
    secure_pubspec_urls: true
    # Imports of packages that are only there as a transitive dependency.
    depend_on_referenced_packages: true
    # A catch-all `catch (e)` stays allowed: the app talks to the platform and the core, where any
    # error must end up in the UI, so avoid_catches_without_on_clauses would mostly be noise.
    # `x.toString()` on a String, `x.round()` on an int: a no-op that usually hides a wrong type.
    noop_primitive_operations: true
    # `x as T` from T?: a null crashes with a cast error far from its cause; `!` says what is meant.
    cast_nullable_to_non_nullable: true
    # Runtime type names are minified in release builds.
    no_runtimeType_toString: true
    # Catching an Error (a bug: RangeError, StateError) hides it; errors are for crashing.
    avoid_catching_errors: true
    # A constructor parameter that is never used: a forgotten field assignment.
    avoid_unused_constructor_parameters: true
    # Two adjacent string literals that join without a space ('foo' 'bar' -> 'foobar').
    missing_whitespace_between_adjacent_strings: true
    # `== true` on a non-nullable bool, `c ? true : x` and similar tangles.
    no_literal_bool_comparisons: true
    avoid_bool_literals_in_conditional_expressions: true
    # Duration.zero and the like instead of rebuilding the same constant.
    use_named_constants: true
    # Locals that never change are final, so an accidental reassignment is an error.
    prefer_final_locals: true
    prefer_final_in_for_each: true
    # Code no entry point reaches.
    unreachable_from_main: true
    # A `!` on something already known to be non-null hides the real type.
    unnecessary_null_checks: true
    # Arguments that repeat the default, closures that could be a tear-off, a library directive with nothing on it.
    avoid_redundant_argument_values: true
    unnecessary_lambdas: true
    unnecessary_library_directive: true
    unnecessary_breaks: true
    # Pass-through constructor parameters, ColoredBox/DecoratedBox/SizedBox.shrink over heavier widgets.
    use_super_parameters: true
    use_colored_box: true
    use_decorated_box: true
    sized_box_shrink_expand: true
    # @Deprecated that disagrees with itself; a `case` that is not a valid pattern in Dart 3.
    deprecated_consistency: true
    invalid_case_patterns: true
    prefer_void_to_null: true
