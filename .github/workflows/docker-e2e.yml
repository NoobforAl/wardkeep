name: Docker end-to-end

# Real VPN clients (OpenVPN, WireGuard, AmneziaWG) against the Linux server, in Docker on a GitHub
# machine: `make docker-e2e`, which is tools/dockertest/run.py. It builds the server, starts it with a TUN device
# and NAT in a container, connects real clients from other containers (one user at a time, then three users at
# once, then IPv6), and checks the tunnel, the server's NAT and the per-user traffic accounting.
#
# It takes about 25 minutes and has never run on GitHub, so it runs on request only (Actions -> Docker
# end-to-end -> Run workflow).
# Once it has passed there, turn the push and pull_request triggers back on.
#
# Every action is pinned to a full commit SHA. The job only reads the repository and holds no secret; it runs
# code from the repository and its dependencies, so the token cannot write anything. The containers it starts
# may open TUN devices and change their own network (NET_ADMIN) and live only as long as the job's machine does.

on:
  workflow_dispatch:

concurrency:
  group: docker-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The clients run in containers but use this machine's kernel: the WireGuard, AmneziaWG and OpenVPN clients
      # need a TUN device. A module that is built in or missing is not an error here; the test says which tunnel
      # failed and shows the client's log.
      - name: Kernel pieces the clients need
        run: |
          sudo modprobe tun || true
          ls -l /dev/net/tun || true
          docker version --format 'Docker {{.Server.Version}}'

      - name: Docker end-to-end test
        shell: bash
        run: make docker-e2e PYTHON=python3 2>&1 | tee e2e.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: docker-e2e-log
          path: e2e.log
          retention-days: 7
